<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">

<div class="container py-5">

    <h1 class="text-center mb-4">Placar</h1>

    <!-- Tabela do placar -->
    <div class="table-responsive">
        <table class="table table-dark table-striped align-middle text-center">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Pontuação</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">1</th>
                    <td>Fulano</td>
                    <td>100</td>
                </tr>
                <tr>
                    <th scope="row">2</th>
                    <td>Ciclano</td>
                    <td>90</td>
                </tr>
                <tr>
                    <th scope="row">3</th>
                    <td>Beltrano</td>
                    <td>85</td>
                </tr>
                <tr>
                    <th scope="row">4</th>
                    <td>Jogador4</td>
                    <td>80</td>
                </tr>
                <tr>
                    <th scope="row">5</th>
                    <td>Jogador5</td>
                    <td>75</td>
                </tr>
                <tr>
                    <th scope="row">6</th>
                    <td>Jogador6</td>
                    <td>70</td>
                </tr>
                <tr>
                    <th scope="row">7</th>
                    <td>Jogador7</td>
                    <td>65</td>
                </tr>
                <tr>
                    <th scope="row">8</th>
                    <td>Jogador8</td>
                    <td>60</td>
                </tr>
                <tr>
                    <th scope="row">9</th>
                    <td>Jogador9</td>
                    <td>55</td>
                </tr>
                <tr>
                    <th scope="row">10</th>
                    <td>Jogador10</td>
                    <td>50</td>
                </tr>
                <!-- Jogador atual / posição abaixo do top 10 -->
                <tr class="table-success">
                    <th scope="row">11</th>
                    <td>Nome do Usuário</td>
                    <td>40</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="text-center mt-4">
        <button class="btn btn-outline-light" onclick="window.location.href='index.html'">Voltar</button>
    </div>

</div>

<!-- Bootstrap JS (opcional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
